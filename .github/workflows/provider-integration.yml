name: Provider integration smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Mail provider to test
        required: true
        type: choice
        options:
          - gmail
          - m365

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run read-only provider smoke test
        env:
          MAILLAB_PROVIDER: ${{ inputs.provider }}
          MAILLAB_TEST_USER: ${{ secrets.MAILLAB_TEST_USER }}
          MAILLAB_CLIENT_ID: ${{ secrets.MAILLAB_CLIENT_ID }}
          MAILLAB_CLIENT_SECRET: ${{ secrets.MAILLAB_CLIENT_SECRET }}
          MAILLAB_REFRESH_TOKEN: ${{ secrets.MAILLAB_REFRESH_TOKEN }}
          MAILLAB_TENANT_ID: ${{ secrets.MAILLAB_TENANT_ID }}
        run: python scripts/provider_smoke.py
