<g font-family="Arial,Helvetica,sans-serif">
 <text x="92" y="280" fill="#F2F7FF" font-size="72" font-weight="700" letter-spacing="-2">MailLab</text>
 <text x="94" y="344" fill="#67DAD3" font-size="38" font-weight="700">SMTP / IMAP Troubleshooting Lab</text>
 <text x="96" y="402" fill="#B6C8E0" font-size="23">Evidence-first diagnostics for email protocol support engineers</text>
