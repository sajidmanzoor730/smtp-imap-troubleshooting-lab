<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">MailLab SMTP and IMAP Troubleshooting Lab</title>
<desc id="desc">A dark navy technical illustration showing email protocol diagnostics, network flow and secure authentication.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset=".55" stop-color="#0B1D3B"/><stop offset="1" stop-color="#06101F"/></linearGradient>
