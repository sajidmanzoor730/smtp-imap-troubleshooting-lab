 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142B4B"/><stop offset="1" stop-color="#0A1930"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8EB6D9" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1600" height="560" rx="28" fill="url(#bg)"/>
<rect width="1600" height="560" rx="28" fill="url(#grid)"/>
