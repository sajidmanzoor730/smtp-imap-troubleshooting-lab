 <text x="110" y="46" fill="#8DAAC8" font-family="monospace" font-size="14">MAIL LAB / DIAGNOSTIC SESSION</text>
 <g font-family="monospace" font-size="17">
  <text x="42" y="105" fill="#7D9AB9">$ maillab smtp relay.example.test --port 587</text>
  <text x="42" y="151" fill="#5CE0B8">[OK] TCP connection established</text>
