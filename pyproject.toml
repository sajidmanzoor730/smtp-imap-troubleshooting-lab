[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maillab"
version = "1.0.0"
description = "Evidence-first SMTP/IMAP diagnostics and fault-injection lab for support engineers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sajid Manzoor" }]
keywords = [
  "smtp",
  "imap",
  "email",
  "starttls",
  "oauth2",
  "xoauth2",
  "wireshark",
  "network-troubleshooting",
  "support-engineering",
  "incident-response",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sajidmanzoor730/smtp-imap-troubleshooting-lab"
Repository = "https://github.com/sajidmanzoor730/smtp-imap-troubleshooting-lab"
Issues = "https://github.com/sajidmanzoor730/smtp-imap-troubleshooting-lab/issues"

[project.scripts]
maillab = "maillab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
