[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maillab"
version = "1.0.0"
description = "SMTP/IMAP troubleshooting toolkit with a fault-injecting mock server and runbooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sajid Manzoor" }]
keywords = ["smtp", "imap", "starttls", "troubleshooting", "wireshark", "support-engineering"]
dependencies = []

[project.scripts]
maillab = "maillab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
